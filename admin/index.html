<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survey Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#07090f;color:#f7f8ff;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}.card{background:#ffffff09;border:1px solid #ffffff16;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 20px 60px #0006}input,textarea,select{width:100%;padding:12px;border:1px solid #ffffff18;border-radius:11px;background:#0b0e15;color:white}textarea{min-height:100px}button{padding:11px 14px;border:1px solid #ffffff18;border-radius:11px;background:#ffffff0d;color:white;cursor:pointer}.primary{background:white;color:#07090f;font-weight:800}.danger{color:#ff9da5;background:#ff405015}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.muted{color:#9ca5b8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;border:1px solid #ffffff12;border-radius:16px}.stat b{display:block;font-size:28px}.q{border:1px solid #ffffff12;padding:14px;border-radius:16px;margin:12px 0}.qrow{display:grid;grid-template-columns:34px 1fr 140px 40px 40px 40px;gap:7px;align-items:center}.num{display:grid;place-items:center;width:30px;height:30px;background:white;color:#111;border-radius:8px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.response{border:1px solid #ffffff12;border-radius:16px;padding:16px;margin:12px 0}.answer{white-space:pre-wrap;background:#05070b;padding:12px;border-radius:10px;margin-top:10px}.toolbar{display:grid;grid-template-columns:1fr 150px 150px auto;gap:8px;margin:14px 0}@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:1fr}.qrow{grid-template-columns:30px 1fr 100px 38px 38px 38px}.toolbar{grid-template-columns:1fr 1fr}.toolbar button{grid-column:span 2}}
</style></head><body><main id="app"><div class="card">Loading Admin…</div></main><script>
const app=document.getElementById('app');let token=localStorage.getItem('survey_admin_token');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function login(){app.innerHTML='<div class="card" style="max-width:420px;margin:12vh auto"><h1>Survey Admin</h1><p class="muted">Secure management panel</p><input id="lu" placeholder="Username" autocomplete="username"><br><br><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><br><br><button class="primary" style="width:100%" onclick="doLogin()">Sign in</button></div>';lp.onkeydown=e=>e.key==='Enter'&&doLogin()}
async function doLogin(){try{const r=await fetch('/api/admin_login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:lu.value,password:lp.value})});const d=await r.json();if(!r.ok)throw 0;token=d.token;localStorage.setItem('survey_admin_token',token);dashboard()}catch{alert('Invalid login')}}
async function dashboard(){try{const d=await api('/api/surveys'),s=d.surveys||[];app.innerHTML='<div class="row"><h1 class="grow">Survey Admin</h1><button onclick="logout()">Logout</button></div><div class="grid"><div class="stat">Surveys<b>'+s.length+'</b></div><div class="stat">Active<b>'+s.filter(x=>x.is_active).length+'</b></div><div class="stat">Responses<b>'+s.reduce((n,x)=>n+Number(x.survey_responses?.[0]?.count||0),0)+'</b></div></div><div class="actions"><button class="primary" onclick="builder()">+ Create Survey</button></div><div id="list">'+(s.length?s.map(card).join(''):'<div class="card muted">No surveys yet.</div>')+'</div>'}catch{logout()}}
function card(s){let link=location.origin+'/s/'+s.id;return '<div class="card"><div class="row"><div class="grow"><h2>'+esc(s.title)+'</h2><div class="muted">'+esc(s.description||'No description')+'</div><p class="muted">'+new Date(s.created_at).toLocaleString()+' · '+Number(s.survey_responses?.[0]?.count||0)+' responses · '+(s.is_active?'Active':'Inactive')+'</p></div></div><div class="actions"><button onclick="copyLink('+JSON.stringify(link)+')">Copy link</button><button onclick="responses('+JSON.stringify(s.id)+')">Responses</button><button onclick="edit('+JSON.stringify(s.id)+')">Edit</button><button onclick="toggle('+JSON.stringify(s.id)+','+(!s.is_active)+')">'+(s.is_active?'Deactivate':'Reactivate')+'</button><button class="danger" onclick="removeSurvey('+JSON.stringify(s.id)+')">Delete</button></div></div>'}
function builder(existing){app.innerHTML='<div class="row"><h1 class="grow">'+(existing?'Edit':'Create')+' Survey</h1><button onclick="dashboard()">Back</button></div><div class="card"><input id="st" maxlength="180" placeholder="Survey title" value="'+esc(existing?.title||'')+'"><br><br><textarea id="sd" placeholder="Description">'+esc(existing?.description||'')+'</textarea><div id="qs"></div><div class="actions"><button onclick="addQ()">+ Add question</button><button class="primary" onclick="save('+JSON.stringify(existing?.id||'')+')">Save survey</button></div></div>';(existing?.questions||[]).forEach(addQ);if(!existing?.questions?.length)addQ()}
function addQ(d={}){let el=document.createElement('div');el.className='q';el.dataset.id=d.id||'q_'+Date.now()+Math.random().toString(36).slice(2);el.innerHTML='<div class="qrow"><span class="num"></span><input class="label" placeholder="Question" value="'+esc(d.label||'')+'"><select class="type"><option>text</option><option>textarea</option><option>radio</option><option>checkbox</option></select><button onclick="move(this,-1)">↑</button><button onclick="move(this,1)">↓</button><button class="danger" onclick="this.closest(\'.q\').remove();renumber()">×</button></div><label><input class="req" type="checkbox" style="width:auto"> Required</label><div class="opts"></div>';qs.appendChild(el);el.querySelector('.type').value=d.type||'text';el.querySelector('.req').checked=!!d.required;el.querySelector('.type').onchange=()=>opts(el);opts(el,d.options||[]);renumber()}
function opts(el,values=[]){let t=el.querySelector('.type').value;el.querySelector('.opts').innerHTML=(t==='radio'||t==='checkbox')?'<br><textarea class="op" placeholder="One option per line">'+esc(values.join('\n'))+'</textarea>':''}
function move(b,n){let e=b.closest('.q'),x=n<0?e.previousElementSibling:e.nextElementSibling;if(x)n<0?x.before(e):x.after(e);renumber()}
function renumber(){document.querySelectorAll('.q').forEach((e,i)=>e.querySelector('.num').textContent=i+1)}
async function save(id){if(!st.value.trim())return alert('Enter title');let questions=[...document.querySelectorAll('.q')].map(e=>({id:e.dataset.id,label:e.querySelector('.label').value.trim(),type:e.querySelector('.type').value,required:e.querySelector('.req').checked,options:[...(e.querySelector('.op')?.value||'').split('\n')].map(x=>x.trim()).filter(Boolean)}));if(!questions.length||questions.some(x=>!x.label))return alert('Complete all questions');try{await api(id?'/api/surveys?id='+id:'/api/surveys',{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:st.value.trim(),description:sd.value,questions})});dashboard()}catch(e){alert(e.message)}}
async function edit(id){try{builder((await api('/api/surveys?id='+id)).survey)}catch(e){alert(e.message)}}
async function toggle(id,v){try{await api('/api/surveys?id='+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_active:v})});dashboard()}catch(e){alert(e.message)}}
async function removeSurvey(id){if(!confirm('Delete survey and all responses permanently?'))return;try{await api('/api/surveys?id='+id,{method:'DELETE'});dashboard()}catch(e){alert(e.message)}}
async function responses(id){try{let d=await api('/api/admin_responses?survey_id='+id);app.innerHTML='<div class="row"><h1 class="grow">Responses</h1><button onclick="dashboard()">Back</button></div><div class="toolbar"><input id="search" placeholder="Search name/email/phone" oninput="filter()"><input id="from" type="date"><input id="to" type="date"><button onclick="filterServer('+JSON.stringify(id)+')">Filter</button></div><div id="responses">'+renderResponses(d.responses||[],id)+'</div></div>'}catch(e){alert(e.message)}}
function renderResponses(a,id){return a.length?a.map(r=>'<div class="response"><h3>'+esc(r.name)+'</h3><div class="muted">'+esc(r.email)+(r.phone?' · '+esc(r.phone):'')+' · '+new Date(r.submitted_at).toLocaleString()+'</div><div class="answer">'+esc(JSON.stringify(r.answers,null,2))+'</div><br><button class="danger" onclick="delResponse('+JSON.stringify(r.id)+','+JSON.stringify(id)+')">Delete</button></div>').join(''):'<div class="card muted">No responses found.</div>'}
function filter(){let q=search.value.toLowerCase();document.querySelectorAll('.response').forEach(e=>e.style.display=e.innerText.toLowerCase().includes(q)?'block':'none')}
async function filterServer(id){let p=new URLSearchParams({survey_id:id});if(search.value)p.set('search',search.value);if(from.value)p.set('from',from.value);if(to.value)p.set('to',to.value);try{let d=await api('/api/admin_responses?'+p);responsesHtml.innerHTML=renderResponses(d.responses||[],id)}catch{}}
async function delResponse(id,s){if(!confirm('Delete response?'))return;await api('/api/admin_responses?id='+id,{method:'DELETE'});responses(s)}
async function copyLink(x){try{await navigator.clipboard.writeText(x);alert('Link copied')}catch{prompt('Copy link',x)}}
function logout(){token=null;localStorage.removeItem('survey_admin_token');login()}
if(token)dashboard();else login();
</script></body></html>
