<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survey</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:10px;background:radial-gradient(700px 450px at 10% 0,#273768,transparent 60%),#07090f;color:#f7f8ff;font:15px system-ui,sans-serif}.card{max-width:760px;margin:20px auto;padding:clamp(20px,5vw,34px);background:#ffffff09;border:1px solid #ffffff16;border-radius:24px;box-shadow:0 25px 80px #0007}.eyebrow{color:#9da8bc;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.title{font-size:clamp(30px,7vw,48px);line-height:1.05;letter-spacing:-.04em;margin:8px 0}.desc{color:#aeb7c9;line-height:1.6}.field,.question{margin:16px 0}.question{padding:16px;border:1px solid #ffffff12;border-radius:16px;background:#ffffff06}.label{font-weight:750;margin-bottom:8px}.input,textarea{width:100%;padding:13px;border:1px solid #ffffff18;border-radius:12px;background:#0b0e15;color:#fff}textarea{min-height:110px}.option{display:flex;gap:9px;align-items:center;padding:10px;border-radius:10px;background:#ffffff05;margin:7px 0}.option input{width:auto}.submit{width:100%;padding:15px;border:0;border-radius:13px;background:#fff;color:#07090f;font-weight:850;cursor:pointer}.error{padding:20px;border-radius:14px;background:#ff405015;color:#ffc0c5}.success{text-align:center;padding:45px 10px}.muted{color:#9da5b8}@media(max-width:520px){.card{margin:8px auto}}
</style></head><body><main class="card"><div id="app">Loading survey…</div></main><script>
const app=document.getElementById('app'),id=new URLSearchParams(location.search).get('id')||location.pathname.split('/').filter(Boolean).pop();let survey;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{if(!id||id==='s')throw 0;let r=await fetch('/api/surveys?id='+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw 0;survey=d.survey;render()}catch{app.innerHTML='<div class="error"><h2>Survey unavailable</h2><p>This survey is inactive or the link is incorrect.</p></div>'}}
function render(){app.innerHTML='<div class="eyebrow">Survey</div><h1 class="title">'+esc(survey.title)+'</h1>'+(survey.description?'<p class="desc">'+esc(survey.description)+'</p>':'')+'<form id="f"><div class="field"><div class="label">Name *</div><input class="input" name="name" maxlength="120" required></div><div class="field"><div class="label">Gmail *</div><input class="input" name="email" type="email" maxlength="200" required></div><div class="field"><div class="label">Phone <span class="muted">(optional)</span></div><input class="input" name="phone" maxlength="30"></div>'+(survey.questions||[]).map(q).join('')+'<button class="submit" id="send">Submit response</button></form>' ;f.onsubmit=submit}
function q(x,i){let h='<div class="question"><div class="label">'+(i+1)+'. '+esc(x.label)+(x.required?' *':'')+'</div>';if(x.type==='radio'||x.type==='checkbox')h+=(x.options||[]).map(o=>'<label class="option"><input type="'+x.type+'" name="q_'+esc(x.id)+'" value="'+esc(o)+'" '+(x.required?'required':'')+'><span>'+esc(o)+'</span></label>').join('');else h+='<'+(x.type==='textarea'?'textarea':'input')+' class="input" name="q_'+esc(x.id)+'" '+(x.required?'required':'')+'></'+(x.type==='textarea'?'textarea':'input')+'>';return h+'</div>'}
async function submit(e){e.preventDefault();send.disabled=true;let fd=new FormData(e.target),answers={};for(let q of survey.questions||[]){let n='q_'+q.id;answers[q.id]=q.type==='checkbox'?fd.getAll(n):fd.get(n)||''}try{let r=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({survey_id:id,name:String(fd.get('name')||'').trim(),email:String(fd.get('email')||'').trim(),phone:String(fd.get('phone')||'').trim(),answers})});if(!r.ok)throw 0;app.innerHTML='<div class="success"><h1>Thank you!</h1><p class="desc">Your response was submitted successfully.</p></div>'}catch{alert('Could not submit response. Please try again.');send.disabled=false}}
load();
</script></body></html>
